<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>PokéSurvivor Toolkit</title>
</head>
<body>
<p style="font-family:system-ui;color:#9aa4b2;padding:1.5rem">Loading PokéSurvivor Toolkit v1.6.7…</p>
<script>
(async function () {
  const files = ['c0.txt','c1.txt','c2.txt','c3.txt','c4.txt','c5.txt','c6.txt','c7.txt','c8.txt','c9.txt','c10.txt','c11.txt','c12.txt','c13.txt','c14.txt','c15.txt','c16.txt','c17.txt','c18.txt','c19.txt','c20.txt','c21.txt','c22.txt','c23.txt','c24.txt'];
  let b64 = '';
  for (const f of files) {
    const r = await fetch(f + '?v=167');
    if (!r.ok) throw new Error('Missing ' + f + ' (' + r.status + ')');
    b64 += (await r.text()).replace(/\s+/g, '');
  }
  const bin = atob(b64);
  const bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  document.open();
  document.write(new TextDecoder().decode(bytes));
  document.close();
})().catch(e => {
  document.body.innerHTML = '<pre style="font-family:system-ui;color:#ef5350;padding:1.5rem">Load failed: ' + e.message + '</pre>';
  console.error(e);
});
</script>
</body>
</html>
