<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>PokéSurvivor Toolkit</title>
</head>
<body>
<p style="font-family:system-ui;color:#9aa4b2;padding:1.5rem">Loading PokéSurvivor Toolkit…</p>
<script>
(async function () {
  const files = ['k0.txt','k1.txt','k2.txt','k3.txt','k4.txt','k5.txt','k6.txt','k7.txt','k8.txt','k9.txt','k10.txt','k11.txt','k12.txt','k13.txt','k14.txt','k15.txt','k16.txt','k17.txt','k18.txt'];
  let b64 = '';
  for (const f of files) {
    const r = await fetch(f + '?v=131');
    if (!r.ok) throw new Error('Missing ' + f + ' (' + r.status + ')');
    b64 += await r.text();
  }
  b64 = b64.replace(/\s+/g, '');
  const bin = atob(b64);
  const bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  document.open();
  document.write(new TextDecoder().decode(bytes));
  document.close();
})().catch(e => {
  document.body.innerHTML = '<pre style="font-family:system-ui;color:#ef5350;padding:1.5rem;white-space:pre-wrap">Load failed: ' + e.message + '</pre>';
  console.error(e);
});
</script>
</body>
</html>
