<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>PokéSurvivor Toolkit</title>
</head>
<body>
<p style="font-family:system-ui;color:#9aa4b2;padding:1.5rem">Loading PokéSurvivor Toolkit v1.5.1…</p>
<script>
(async function () {
  const files = ['pk0.txt','pk1.txt','pk2.txt','pk3.txt','pk4.txt','pk5.txt','pk6.txt','pk7.txt','pk8.txt','pk9.txt','pk10.txt','pk11.txt','pk12.txt','pk13.txt','pk14.txt'];
  let b64 = '';
  for (const f of files) {
    const r = await fetch(f + '?v=151');
    if (!r.ok) throw new Error('Missing ' + f + ' (' + r.status + ')');
    b64 += (await r.text()).replace(/\s+/g, '');
  }
  const bin = atob(b64);
  const bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  document.open();
  document.write(new TextDecoder().decode(bytes));
  document.close();
})().catch(e => {
  document.body.innerHTML = '<pre style="font-family:system-ui;color:#ef5350;padding:1.5rem;white-space:pre-wrap">Load failed: ' + e.message + '</pre>';
  console.error(e);
});
</script>
</body>
</html>
