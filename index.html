<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>PokéSurvivor Toolkit</title>
</head>
<body>
<p style="font-family:system-ui;color:#9aa4b2;padding:1.5rem">Loading PokéSurvivor Toolkit…</p>
<script>
(async function () {
  const files = ['b64_0.txt', 'b64_1.txt', 'b64_2.txt', 'b64_3.txt', 'b64_4.txt', 'b64_5.txt', 'b64_6.txt', 'b64_7.txt'];
  let b64 = '';
  for (const f of files) {
    const r = await fetch(f + '?v=130');
    if (!r.ok) throw new Error('Missing ' + f);
    b64 += await r.text();
  }
  b64 = b64.replace(/\s/g, '');
  const bin = atob(b64);
  const bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  const html = new TextDecoder().decode(bytes);
  document.open();
  document.write(html);
  document.close();
})().catch(e => {
  document.body.innerHTML = '<p style="font-family:system-ui;color:#ef5350;padding:1.5rem">Load failed: ' + e.message + '</p>';
  console.error(e);
});
</script>
</body>
</html>
